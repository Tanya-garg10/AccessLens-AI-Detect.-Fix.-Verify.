name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint codebase
        run: pnpm lint

      - name: Generate Prisma client
        run: pnpm --filter @accesslens/api prisma:generate

      - name: Typecheck TypeScript
        run: |
          pnpm --filter @accesslens/shared build
          pnpm --filter @accesslens/api build
          pnpm --filter @accesslens/web build

      - name: Run unit & service tests (Vitest)
        run: pnpm --filter @accesslens/api test

      - name: Build applications
        run: pnpm build
